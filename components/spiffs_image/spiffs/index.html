<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDP2DMX WiFi Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-bar {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #555;
        }

        .status-label {
            font-weight: 500;
        }

        .status-value {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin: 0 0 0 10px;
            margin-bottom: 0;
            cursor: pointer;
        }

        .ip-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .ip-section.active {
            display: block;
        }

        .ip-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }

        .button-secondary:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌐 UDP2DMX</h1>
        <p class="subtitle">WiFi Configuration</p>

        <div class="alert" id="alert"></div>

        <div class="status-bar" id="statusBar">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="statusValue">Loading...</span>
            </div>
            <div class="status-item">
                <span class="status-label">IP Address:</span>
                <span class="status-value" id="ipValue">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">Version:</span>
                <span class="status-value" id="versionValue">-</span>
            </div>
        </div>

        <form id="wifiForm">
            <div class="form-group">
                <label for="hostname">Hostname</label>
                <input type="text" id="hostname" name="hostname" placeholder="e.g. udp2dmx">
            </div>

            <div class="form-group">
                <label for="ssid">WiFi SSID</label>
                <input type="text" id="ssid" name="ssid" placeholder="e.g. MyNetwork">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="useDhcp" name="useDhcp" checked>
                <label for="useDhcp">DHCP (automatic IP)</label>
            </div>

            <div class="ip-section" id="staticIpSection">
                <h3>Static IP Configuration</h3>

                <div class="form-group">
                    <label for="staticIp">IP Address</label>
                    <input type="text" id="staticIp" name="staticIp" placeholder="192.168.1.100">
                </div>

                <div class="form-group">
                    <label for="gateway">Gateway</label>
                    <input type="text" id="gateway" name="gateway" placeholder="192.168.1.1">
                </div>

                <div class="form-group">
                    <label for="dns">DNS Server</label>
                    <input type="text" id="dns" name="dns" placeholder="8.8.8.8">
                </div>
            </div>

            <button type="button" id="hostnameSaveBtn">💾 Save Hostname</button>
            <button type="button" id="saveBtn">💾 Save WiFi & Reboot</button>
        </form>

        <div class="divider"></div>

        <h3 style="margin-bottom: 15px;">Configuration</h3>
        <button type="button" class="button-secondary" id="downloadBtn">⬇️ Download Config</button>
        <button type="button" class="button-secondary" id="uploadBtn">⬆️ Upload Config</button>
        <input type="file" id="fileInput" accept=".json" style="display: none;">

        <div class="divider"></div>

        <h3 style="margin-bottom: 15px;">Debug</h3>
        <button type="button" class="button-secondary" id="rebootBtn">⚡ Reboot ESP32</button>
        <button type="button" class="button-secondary" id="dmxStatusBtn">🔎 DMX Status</button>

        <div class="form-group" style="margin-top: 15px;">
            <label for="fwFile">Firmware (.bin)</label>
            <input type="file" id="fwFile" accept=".bin" />
        </div>
        <button type="button" class="button-secondary" id="fwUploadBtn">⬆️ Upload Firmware (OTA)</button>
        <button type="button" class="button-secondary" id="fwRollbackBtn">⏪ Rollback (previous OTA)</button>

        <div class="form-group" style="margin-top: 15px;">
            <label for="spiffsFile">Web UI (SPIFFS Image)</label>
            <input type="file" id="spiffsFile" accept=".bin" />
        </div>
        <button type="button" class="button-secondary" id="spiffsUploadBtn">⬆️ Upload Web UI (SPIFFS)</button>

        <div class="footer">
            <p><small>Status updates on page load</small></p>
        </div>
    </div>

    <script>
        const API_BASE = '';

        // ==================== UI Elements ====================
        const form = document.getElementById('wifiForm');
        const useDhcpCheckbox = document.getElementById('useDhcp');
        const staticIpSection = document.getElementById('staticIpSection');
        const hostnameSaveBtn = document.getElementById('hostnameSaveBtn');
        const saveBtn = document.getElementById('saveBtn');
        const rebootBtn = document.getElementById('rebootBtn');
        const dmxStatusBtn = document.getElementById('dmxStatusBtn');
        const fwFile = document.getElementById('fwFile');
        const fwUploadBtn = document.getElementById('fwUploadBtn');
        const fwRollbackBtn = document.getElementById('fwRollbackBtn');
        const spiffsFile = document.getElementById('spiffsFile');
        const spiffsUploadBtn = document.getElementById('spiffsUploadBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const alert = document.getElementById('alert');

        // ==================== Event Listeners ====================

        useDhcpCheckbox.addEventListener('change', function () {
            staticIpSection.classList.toggle('active', !this.checked);
        });

        hostnameSaveBtn.addEventListener('click', async function () {
            await saveHostnameOnly();
        });

        saveBtn.addEventListener('click', async function () {
            await saveWifiOnly();
        });

        rebootBtn.addEventListener('click', async function () {
            if (confirm('Really reboot ESP32?')) {
                await rebootDevice();
            }
        });

        dmxStatusBtn.addEventListener('click', function () {
            window.location.href = `${API_BASE}/dmx/status`;
        });

        fwUploadBtn.addEventListener('click', async function () {
            if (!fwFile.files || fwFile.files.length === 0) {
                showAlert('Please select a .bin firmware file first', 'error');
                return;
            }

            const file = fwFile.files[0];
            if (!confirm(`Upload firmware "${file.name}" (${Math.round(file.size / 1024)} KB) and reboot?`)) {
                return;
            }

            try {
                fwUploadBtn.disabled = true;
                fwUploadBtn.innerHTML = '<span class="spinner"></span> Uploading...';

                const resp = await fetch(`${API_BASE}/api/ota/upload`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream'
                    },
                    body: file
                });

                const text = await resp.text();
                if (!resp.ok) throw new Error(text || 'OTA upload failed');

                showAlert(text || 'OK - rebooting', 'success');
            } catch (e) {
                console.error(e);
                showAlert(`OTA upload error: ${e.message}`, 'error');
            } finally {
                fwUploadBtn.disabled = false;
                fwUploadBtn.innerHTML = '⬆️ Upload Firmware (OTA)';
            }
        });

        fwRollbackBtn.addEventListener('click', async function () {
            if (!confirm('Rollback to previous OTA slot and reboot?')) {
                return;
            }

            try {
                fwRollbackBtn.disabled = true;
                fwRollbackBtn.innerHTML = '<span class="spinner"></span> Rolling back...';

                const resp = await fetch(`${API_BASE}/api/ota/rollback`, {
                    method: 'POST'
                });
                const text = await resp.text();
                if (!resp.ok) throw new Error(text || 'Rollback failed');

                showAlert(text || 'OK - rebooting', 'success');
            } catch (e) {
                console.error(e);
                showAlert(`Rollback error: ${e.message}`, 'error');
            } finally {
                fwRollbackBtn.disabled = false;
                fwRollbackBtn.innerHTML = '⏪ Rollback (previous OTA)';
            }
        });

        spiffsUploadBtn.addEventListener('click', async function () {
            if (!spiffsFile.files || spiffsFile.files.length === 0) {
                showAlert('Please select a SPIFFS .bin image first', 'error');
                return;
            }

            const file = spiffsFile.files[0];
            if (!confirm(`Upload Web UI (SPIFFS) "${file.name}" (${Math.round(file.size / 1024)} KB) and reboot?`)) {
                return;
            }

            try {
                spiffsUploadBtn.disabled = true;
                spiffsUploadBtn.innerHTML = '<span class="spinner"></span> Uploading...';

                const resp = await fetch(`${API_BASE}/api/ota/spiffs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream'
                    },
                    body: file
                });

                const text = await resp.text();
                if (!resp.ok) throw new Error(text || 'SPIFFS upload failed');

                showAlert(text || 'OK - rebooting', 'success');
            } catch (e) {
                console.error(e);
                showAlert(`SPIFFS upload error: ${e.message}`, 'error');
            } finally {
                spiffsUploadBtn.disabled = false;
                spiffsUploadBtn.innerHTML = '⬆️ Upload Web UI (SPIFFS)';
            }
        });

        downloadBtn.addEventListener('click', async function () {
            await downloadConfig();
        });

        uploadBtn.addEventListener('click', async function () {
            fileInput.click();
        });

        fileInput.addEventListener('change', async function (e) {
            if (e.target.files.length > 0) {
                await uploadConfig(e.target.files[0]);
                fileInput.value = '';
            }
        });

        // ==================== Functions ====================

        function showAlert(message, type = 'info') {
            alert.textContent = message;
            alert.className = `alert show alert-${type}`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        function setButtonLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Processing...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn === hostnameSaveBtn ? '💾 Save Hostname' :
                    btn === saveBtn ? '💾 Save WiFi & Reboot' :
                    btn === rebootBtn ? '⚡ Reboot ESP32' : '🔄 Refresh Status';
            }
        }

        async function loadWifiConfig() {
            try {
                // Load complete config from SPIFFS (includes hostname)
                const configResponse = await fetch(`${API_BASE}/config`);
                if (configResponse.ok) {
                    const config = await configResponse.json();
                    document.getElementById('hostname').value = config.hostname || 'udp2dmx';
                }

                // Load WiFi config from NVS
                const response = await fetch(`${API_BASE}/api/wifi`);
                if (!response.ok) throw new Error('Failed to load configuration');

                const data = await response.json();
                const wifi = data.primary_wifi;

                document.getElementById('ssid').value = wifi.ssid || '';
                document.getElementById('useDhcp').checked = wifi.use_dhcp !== false;
                document.getElementById('staticIp').value = wifi.static_ip || '';
                document.getElementById('gateway').value = wifi.gateway || '';
                document.getElementById('dns').value = wifi.dns || '';

                staticIpSection.classList.toggle('active', !wifi.use_dhcp);
            } catch (error) {
                console.error('Error loading config:', error);
                showAlert('Error loading configuration', 'error');
            }
        }

        async function loadSystemStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/system`);
                if (!response.ok) throw new Error('Failed to load status');

                const data = await response.json();

                // Determine connection status and type
                let statusText = '🔴 Not Connected';
                if (data.connection_type === 'LAN') {
                    statusText = `🟢 Connected (LAN)`;
                } else if (data.connection_type === 'WiFi') {
                    statusText = `🟢 Connected (WiFi - ${data.wifi_ssid})`;
                }

                document.getElementById('statusValue').textContent = statusText;
                document.getElementById('ipValue').textContent = data.ip_address;
                if (data.hostname) {
                    document.getElementById('hostname').value = data.hostname;
                }
                const version = data.app_version || '-';
                const slot = data.running_partition ? ` (${data.running_partition})` : '';
                document.getElementById('versionValue').textContent = `${version}${slot}`;
            } catch (error) {
                console.error('Error loading status:', error);
                document.getElementById('statusValue').textContent = 'Error loading';
            }
        }

        async function saveHostnameOnly() {
            const hostname = (document.getElementById('hostname').value || '').trim();
            if (!hostname) {
                showAlert('Hostname is required', 'error');
                return;
            }

            setButtonLoading(hostnameSaveBtn, true);

            try {
                const hostnameUpdate = { hostname };
                const patchResponse = await fetch(`${API_BASE}/config/patch`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(hostnameUpdate)
                });

                if (!patchResponse.ok) {
                    const error = await patchResponse.text();
                    throw new Error(error || 'Failed to save hostname');
                }

                showAlert('✅ Hostname saved', 'success');

                // Refresh status to display current hostname
                await loadSystemStatus();
            } catch (error) {
                console.error('Error saving hostname:', error);
                showAlert(`Error: ${error.message}`, 'error');
            } finally {
                setButtonLoading(hostnameSaveBtn, false);
            }
        }

        async function saveWifiOnly() {
            const ssid = (document.getElementById('ssid').value || '').trim();
            const password = document.getElementById('password').value || '';
            const useDhcp = document.getElementById('useDhcp').checked;
            const staticIp = (document.getElementById('staticIp').value || '').trim();
            const gateway = (document.getElementById('gateway').value || '').trim();
            const dns = (document.getElementById('dns').value || '').trim();

            if (!ssid || !password) {
                showAlert('SSID and Password are required to save WiFi settings', 'error');
                return;
            }

            if (!useDhcp) {
                const resolvedStaticIp = staticIp || '0.0.0.0';
                const resolvedGateway = gateway || '0.0.0.0';
                if (!isValidIP(resolvedStaticIp) || !isValidIP(resolvedGateway)) {
                    showAlert('Invalid static IP addresses', 'error');
                    return;
                }
            }

            setButtonLoading(saveBtn, true);

            try {
                const wifiConfig = {
                    ssid,
                    password,
                    use_dhcp: useDhcp,
                    static_ip: staticIp || '0.0.0.0',
                    gateway: gateway || '0.0.0.0',
                    dns: dns || '8.8.8.8'
                };

                const wifiResponse = await fetch(`${API_BASE}/api/wifi`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(wifiConfig)
                });

                if (!wifiResponse.ok) {
                    const error = await wifiResponse.text();
                    throw new Error(error || 'Failed to save WiFi config');
                }

                showAlert('✅ WiFi saved! ESP is rebooting...', 'success');

                // Disable form during restart
                form.style.opacity = '0.5';
                form.style.pointerEvents = 'none';

                setTimeout(() => {
                    location.reload();
                }, 3000);
            } catch (error) {
                console.error('Error saving WiFi:', error);
                showAlert(`Error: ${error.message}`, 'error');
                setButtonLoading(saveBtn, false);
            }
        }

        async function downloadConfig() {
            try {
                const response = await fetch(`${API_BASE}/config`);
                if (!response.ok) throw new Error('Failed to download config');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'config.json';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                showAlert('✅ Config downloaded', 'success');
            } catch (error) {
                console.error('Error downloading config:', error);
                showAlert('Error downloading config', 'error');
            }
        }

        async function uploadConfig(file) {
            try {
                const content = await file.text();
                const config = JSON.parse(content);

                setButtonLoading(uploadBtn, true);

                const response = await fetch(`${API_BASE}/config`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                if (!response.ok) throw new Error('Failed to upload config');

                showAlert('✅ Config uploaded! ESP is rebooting...', 'success');

                setTimeout(() => {
                    location.reload();
                }, 2000);
            } catch (error) {
                console.error('Error uploading config:', error);
                showAlert(`Error: ${error.message}`, 'error');
                setButtonLoading(uploadBtn, false);
            }
        }

        async function rebootDevice() {
            setButtonLoading(rebootBtn, true);

            try {
                const response = await fetch(`${API_BASE}/api/system/reboot`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Failed to reboot');

                showAlert('⚡ ESP is rebooting...', 'info');

                setTimeout(() => {
                    location.reload();
                }, 2000);
            } catch (error) {
                console.error('Error rebooting:', error);
                showAlert('Error rebooting device', 'error');
                setButtonLoading(rebootBtn, false);
            }
        }

        function isValidIP(ip) {
            if (!ip) return false;
            const parts = ip.split('.');
            if (parts.length !== 4) return false;
            return parts.every(part => {
                const num = parseInt(part);
                return num >= 0 && num <= 255;
            });
        }

        // ==================== Initialization ====================

        document.addEventListener('DOMContentLoaded', function () {
            loadWifiConfig();
            loadSystemStatus();
        });
    </script>
</body>

</html>
